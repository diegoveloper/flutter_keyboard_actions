# Step 2: dry-run, tag (if needed), publish to pub.dev.
#
# Tags pushed with GITHUB_TOKEN do not trigger other workflows, so this job
# publishes directly instead of relying on publish.yml.
#
# Prerequisites:
#   - Release prepare already ran for this version.
#   - You reviewed/edited CHANGELOG.md on master.
#
# Usage:
#   Actions → Release publish → version: 5.0.1
#
# Safe to re-run with the same version if the tag already exists (retry publish).
#
name: Release publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (must match pubspec on master, e.g. 5.0.1)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write # pub.dev OIDC

concurrency:
  group: release-publish-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version input
        run: |
          version='${{ inputs.version }}'
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$version'. Use MAJOR.MINOR.PATCH (e.g. 5.0.1)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Fetch tags
        run: git fetch --tags origin

      - name: Verify release is ready
        id: verify
        run: |
          version='${{ inputs.version }}'
          pubspec=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/[[:space:]]*$//')
          if [[ "$pubspec" != "$version" ]]; then
            echo "::error::pubspec.yaml is '$pubspec' but you asked to publish '$version'."
            echo "Run **Release prepare** first, or fix pubspec on master."
            exit 1
          fi
          if ! grep -qE "^## \\[${version}\\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section '## [${version}]'."
            echo "Run **Release prepare** first."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${version}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${version} already on origin — will publish without creating a new tag."
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tagged release
        if: steps.verify.outputs.tag_exists == 'true'
        run: git checkout "refs/tags/${{ inputs.version }}"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dart-lang/setup-dart@v1

      - name: Dry-run publish
        run: flutter pub publish --dry-run

      - name: Create and push tag
        if: steps.verify.outputs.tag_exists != 'true'
        run: |
          version='${{ inputs.version }}'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "Release ${version}"
          git push origin "$version"

      - name: Publish to pub.dev
        run: flutter pub publish --force

      - name: Summary
        run: |
          {
            echo "### \`${{ inputs.version }}\` published"
            echo ""
            if [[ "${{ steps.verify.outputs.tag_exists }}" == "true" ]]; then
              echo "- Reused existing tag"
            else
              echo "- Tag pushed"
            fi
            echo "- pub.dev publish completed"
            echo ""
            echo "https://pub.dev/packages/keyboard_actions"
          } >> "$GITHUB_STEP_SUMMARY"
