# Step 2: dry-run, tag, push tag, publish to pub.dev.
#
# Tags pushed with GITHUB_TOKEN do not trigger other workflows, so this job
# publishes directly instead of relying on publish.yml.
#
# Prerequisites:
#   - Release prepare already ran for this version.
#   - You reviewed/edited CHANGELOG.md on master.
#
# Usage:
#   Actions → Release publish → version: 5.0.1
#
# If the tag already exists (e.g. a prior run tagged but publish failed):
#   Actions → Publish to pub.dev → Run workflow → select tag 5.0.1
#
name: Release publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (must match pubspec on master, e.g. 5.0.1)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write # pub.dev OIDC

concurrency:
  group: release-publish-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version input
        run: |
          version='${{ inputs.version }}'
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$version'. Use MAJOR.MINOR.PATCH (e.g. 5.0.1)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Fetch tags
        run: git fetch --tags origin

      - name: Verify release is ready on master
        run: |
          version='${{ inputs.version }}'
          pubspec=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/[[:space:]]*$//')
          if [[ "$pubspec" != "$version" ]]; then
            echo "::error::pubspec.yaml is '$pubspec' but you asked to publish '$version'."
            echo "Run **Release prepare** first, or fix pubspec on master."
            exit 1
          fi
          if ! grep -qE "^## \\[${version}\\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section '## [${version}]'."
            echo "Run **Release prepare** first."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${version}" >/dev/null 2>&1; then
            echo "::error::Tag '${version}' already exists on origin."
            echo "Run **Publish to pub.dev** manually and select tag \`${version}\`,"
            echo "or delete the tag and retry: git push origin :refs/tags/${version}"
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dart-lang/setup-dart@v1

      - name: Dry-run publish
        run: flutter pub publish --dry-run

      - name: Create and push tag
        run: |
          version='${{ inputs.version }}'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "Release ${version}"
          git push origin "$version"

      - name: Publish to pub.dev
        run: flutter pub publish --force

      - name: Summary
        run: |
          {
            echo "### \`${{ inputs.version }}\` published"
            echo ""
            echo "- Tag pushed"
            echo "- pub.dev publish completed"
            echo ""
            echo "https://pub.dev/packages/keyboard_actions"
          } >> "$GITHUB_STEP_SUMMARY"
