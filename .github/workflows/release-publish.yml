# Step 2: dry-run, create tag, push tag → triggers Publish to pub.dev.
#
# Prerequisites:
#   - Release prepare already ran for this version (or pubspec/CHANGELOG match).
#   - You reviewed/edited CHANGELOG.md on master.
#
# Usage:
#   Actions → Release publish → version: 5.0.1
#
# Retry after a failed publish (tag exists, pub.dev not updated):
#   git push origin :refs/tags/5.0.1
#   then run this workflow again.
#
name: Release publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (must match pubspec on master, e.g. 5.0.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-publish-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version input
        run: |
          version='${{ inputs.version }}'
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$version'. Use MAJOR.MINOR.PATCH (e.g. 5.0.1)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Fetch tags
        run: git fetch --tags origin

      - name: Verify release is ready on master
        run: |
          version='${{ inputs.version }}'
          pubspec=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/[[:space:]]*$//')
          if [[ "$pubspec" != "$version" ]]; then
            echo "::error::pubspec.yaml is '$pubspec' but you asked to publish '$version'."
            echo "Run **Release prepare** first, or fix pubspec on master."
            exit 1
          fi
          if ! grep -qE "^## \\[${version}\\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section '## [${version}]'."
            echo "Run **Release prepare** first."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${version}" >/dev/null 2>&1; then
            echo "::error::Tag '${version}' already exists on origin."
            echo "Delete it to retry: git push origin :refs/tags/${version}"
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dart-lang/setup-dart@v1

      - name: Dry-run publish
        run: flutter pub publish --dry-run

      - name: Create and push tag
        run: |
          version='${{ inputs.version }}'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "Release ${version}"
          git push origin "$version"

      - name: Summary
        run: |
          {
            echo "### Tag \`${{ inputs.version }}\` pushed"
            echo ""
            echo "**Publish to pub.dev** should run automatically."
            echo ""
            echo "Watch: https://github.com/${{ github.repository }}/actions/workflows/publish.yml"
          } >> "$GITHUB_STEP_SUMMARY"
