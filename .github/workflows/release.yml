name: Package Publish

on:
  push:
    branches: [release]
    tags:
      # Must match the tag pattern configured on pub.dev ({{version}})
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  check_and_tag:
    name: Check Version and Tag
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use a PAT with `repo` + `workflow` so the created tag triggers the publish job.
          # Without it, GitHub won't start workflows from tags pushed with GITHUB_TOKEN.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Get latest git tag
        id: previoustag
        continue-on-error: true
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Get pubspec version
        id: config
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          echo "version_name=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"

      - name: Compare version
        if: steps.config.outputs.version_name == steps.previoustag.outputs.tag
        run: |
          echo "pubspec version matches the latest tag (${{ steps.config.outputs.version_name }}). Bump the version first."
          exit 1

      - name: Create and push version tag
        run: |
          version="${{ steps.config.outputs.version_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$version"
          git push origin "$version"
          echo "Tagged $version — publish job should run on that tag push."

  publish:
    name: Publish to pub.dev
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for pub.dev OIDC (no manual OAuth)
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Registers a temporary pub.dev token via GitHub OIDC
      - uses: dart-lang/setup-dart@v1

      - name: Publish
        run: flutter pub publish --force
