# Step 1: bump version, generate CHANGELOG, push to master. No tag yet.
#
# Usage:
#   Actions → Release prepare → version: 5.0.1
#
# Then edit CHANGELOG.md on master if you want (GitHub UI or local commit).
# When ready:
#   Actions → Release publish → version: 5.0.1
#
# Retry: if pubspec/CHANGELOG already at that version, file edits are skipped.
#
name: Release prepare

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to prepare (e.g. 5.0.1)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version input
        run: |
          version='${{ inputs.version }}'
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$version'. Use MAJOR.MINOR.PATCH (e.g. 5.0.1)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Fetch tags
        run: git fetch --tags origin

      - name: Generate changelog and bump pubspec
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x tool/generate_changelog.sh
          tool/generate_changelog.sh '${{ inputs.version }}'

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No file changes (already prepared at ${{ inputs.version }})."
          else
            git add pubspec.yaml CHANGELOG.md
            git commit -m "chore: release ${{ inputs.version }}"
            git push origin master
          fi

      - name: Summary
        run: |
          {
            echo "### Release ${{ inputs.version }} prepared on \`master\`"
            echo ""
            echo "1. Review [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) — edit on \`master\` if needed."
            echo "2. When ready, run **Release publish** with version \`${{ inputs.version }}\`."
            echo ""
            echo "No tag was created yet."
          } >> "$GITHUB_STEP_SUMMARY"
